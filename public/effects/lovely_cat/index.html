<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>派派小猫</title>
    <style>
      html, body {
        background: transparent;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .cat {
        position: relative;
        width: 56vmin;
        height: 44vmin;
        margin-top: 10vmin;
        /* Flip horizontally so Cat on Left faces RIGHT toward Corgi on Right */
        transform: scaleX(-1);
      }
      .heart {
        position: absolute;
        width: 7%;
        height: 8.5%;
        background-color: #fb7185;
        border-bottom-right-radius: 23%;
        opacity: 0;
      }
      .heart:before, .heart:after {
        position: absolute;
        width: 100%;
        height: 100%;
        content: '';
        border-radius: 50%;
        background-color: #fb7185;
      }
      .heart:after { bottom: 0; left: -53%; }
      .heart:before { top: -53%; right: 0; transform: rotate(45deg); }
      @keyframes heart-beat {
        0% { transform: scale(0.75) rotate(35deg); opacity: 1; }
        20% { transform: scale(1) rotate(35deg); }
        70% { opacity: 1; }
        100% { transform: rotate(35deg) translateY(-12px) translateX(-8px); opacity: 0; }
      }
      .heart--1 { top: -22%; left: 22%; animation: heart-beat 2.2s ease-out infinite 1.2s; }
      .heart--2 { top: -36%; left: 10%; animation: heart-beat 2.2s ease-out infinite 0.5s; }
      .heart--3 { top: -44%; left: 28%; animation: heart-beat 2.2s ease-out infinite 1.7s; }

      .cat-body {
        position: absolute;
        width: 82%;
        height: 46%;
        left: 12%;
        bottom: 12%;
        background: linear-gradient(180deg, #e7b574 0%, #d49b56 100%);
        border-radius: 40% 45% 28% 32%;
        z-index: 3;
      }
      .cat-chest {
        position: absolute;
        width: 44%;
        height: 75%;
        left: 4%;
        bottom: 2%;
        background: #fffdf8;
        border-radius: 50% 45% 45% 40%;
        z-index: 4;
      }
      .cat-tail {
        position: absolute;
        right: -12%;
        top: -26%;
        width: 18%;
        height: 68%;
        border-radius: 50% 50% 30% 30%;
        background: linear-gradient(180deg, #d49b56 0%, #e7b574 100%);
        transform-origin: bottom center;
        z-index: 2;
        animation: cat-tail 1.4s ease-in-out infinite alternate;
      }
      @keyframes cat-tail {
        0% { transform: rotate(18deg); }
        100% { transform: rotate(46deg); }
      }
      .cat-legs div {
        position: absolute;
        bottom: -22%;
        width: 11%;
        height: 30%;
        background: #e7b574;
        border-radius: 0 0 50% 50%;
        z-index: 2;
      }
      .cat-legs div::after {
        content: '';
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 45%;
        background: #fffdf8;
        border-radius: 0 0 50% 50%;
      }
      .leg-1 { left: 14%; }
      .leg-2 { left: 32%; }
      .leg-3 { left: 66%; }
      .leg-4 { left: 82%; }

      .cat-head {
        position: absolute;
        width: 46%;
        height: 46%;
        left: 4%;
        top: 14%;
        background: radial-gradient(circle at 45% 40%, #f1ca8f 0%, #dfa863 100%);
        border-radius: 48% 48% 44% 44%;
        z-index: 6;
        animation: cat-head-bob 1.5s ease-in-out infinite alternate;
      }
      @keyframes cat-head-bob {
        to { transform: translateY(-2px) rotate(-3deg); }
      }
      .ear {
        position: absolute;
        top: -26%;
        width: 34%;
        height: 42%;
        background: #d49b56;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        z-index: 5;
      }
      .ear::after {
        content: '';
        position: absolute;
        inset: 28% 22% 8% 22%;
        background: #fbcfe8;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      }
      .ear--left { left: 4%; transform: rotate(-14deg); }
      .ear--right { right: 4%; transform: rotate(14deg); }

      .cat-muzzle {
        position: absolute;
        bottom: 12%;
        left: 22%;
        width: 56%;
        height: 36%;
        background: #fffdf8;
        border-radius: 50%;
        z-index: 7;
      }
      .cat-nose {
        position: absolute;
        top: 18%;
        left: 42%;
        width: 16%;
        height: 20%;
        background: #f472b6;
        border-radius: 45% 45% 60% 60%;
      }
      .cat-mouth {
        position: absolute;
        top: 38%;
        left: 32%;
        width: 36%;
        height: 26%;
        border-bottom: 2px solid #52525b;
        border-radius: 0 0 50% 50%;
      }
      .cat-eye {
        position: absolute;
        top: 34%;
        width: 16%;
        height: 18%;
        background: #1f2937;
        border-radius: 50%;
        z-index: 8;
        animation: cat-blink 2.6s infinite;
      }
      .cat-eye::after {
        content: '';
        position: absolute;
        top: 18%;
        left: 22%;
        width: 34%;
        height: 34%;
        background: #fff;
        border-radius: 50%;
      }
      .cat-eye--left { left: 20%; }
      .cat-eye--right { right: 20%; }
      @keyframes cat-blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      /* Golden Tabby Dark-Brown/Black Stripes */
      .stripe {
        position: absolute;
        background: #3f2a1d;
        border-radius: 99px;
        z-index: 6;
      }
      .stripe-f1 { top: 10%; left: 42%; width: 7%; height: 22%; transform: rotate(-10deg); }
      .stripe-f2 { top: 8%; left: 50%; width: 7%; height: 24%; }
      .stripe-f3 { top: 10%; left: 58%; width: 7%; height: 22%; transform: rotate(10deg); }
      .stripe-b1 { top: 10%; left: 46%; width: 8%; height: 42%; transform: rotate(-6deg); z-index: 4; }
      .stripe-b2 { top: 10%; left: 60%; width: 8%; height: 46%; transform: rotate(-4deg); z-index: 4; }
      .stripe-b3 { top: 14%; left: 74%; width: 7%; height: 38%; transform: rotate(-8deg); z-index: 4; }
      .stripe-t1 { top: 22%; left: 15%; width: 70%; height: 14%; }
      .stripe-t2 { top: 48%; left: 15%; width: 70%; height: 14%; }
    </style>
  </head>
  <body>
    <div class="cat">
      <div class="heart heart--1"></div>
      <div class="heart heart--2"></div>
      <div class="heart heart--3"></div>
      <div class="cat-head">
        <div class="ear ear--left"></div>
        <div class="ear ear--right"></div>
        <div class="stripe stripe-f1"></div>
        <div class="stripe stripe-f2"></div>
        <div class="stripe stripe-f3"></div>
        <div class="cat-eye cat-eye--left"></div>
        <div class="cat-eye cat-eye--right"></div>
        <div class="cat-muzzle">
          <div class="cat-nose"></div>
          <div class="cat-mouth"></div>
        </div>
      </div>
      <div class="cat-body">
        <div class="cat-chest"></div>
        <div class="stripe stripe-b1"></div>
        <div class="stripe stripe-b2"></div>
        <div class="stripe stripe-b3"></div>
        <div class="cat-legs">
          <div class="leg-1"></div>
          <div class="leg-2"></div>
          <div class="leg-3"></div>
          <div class="leg-4"></div>
        </div>
        <div class="cat-tail">
          <div class="stripe stripe-t1"></div>
          <div class="stripe stripe-t2"></div>
        </div>
      </div>
    </div>
  </body>
</html>
